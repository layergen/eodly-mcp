# Publishes @eodly/mcp to npm AND the official MCP registry when you cut a GitHub
# Release. Bump the version in package.json + server.json first, commit, then create
# a Release for that version.
#
# One-time setup, no secrets required. Both publishes authenticate via GitHub OIDC:
#   - npm: configure Trusted Publishing on npmjs.com for @eodly/mcp
#     (package Settings > Trusted Publisher) pointing at layergen/eodly-mcp and this
#     workflow filename, publish.yml. npm then trusts this workflow directly, so there
#     is no NPM_TOKEN to store, expire or rotate, and npm records build provenance.
#   - MCP registry: authenticates via GitHub OIDC for the io.github.layergen/* namespace.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for the MCP registry GitHub OIDC login

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # setup-node pins an older bundled npm; Trusted Publishing needs 11.5.1+.
      - run: npm install -g npm@latest

      # 1) Publish to npm via Trusted Publishing (OIDC). No token: npm verifies this
      #    workflow's identity, and records provenance because repo and package are public.
      - run: npm publish --access public

      # 2) Publish to the official MCP registry via GitHub OIDC (no secret needed).
      - name: Install mcp-publisher
        run: curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Publish to MCP registry
        # If `login github-oidc` errors, check the current subcommand in the registry
        # docs (github.com/modelcontextprotocol/registry); the CLI auto-detects the
        # Actions OIDC token for the io.github.layergen/* namespace.
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
